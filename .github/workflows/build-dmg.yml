name: Build macOS Universal DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile Universal macOS App Bundle (arm64 + x86_64) & DMG
        run: |
          APP_DIR="dmg_stage/2TI LMailer.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources/dist"

          clang -O2 -fobjc-arc -arch arm64 -arch x86_64 \
            -framework Cocoa -framework WebKit \
            macos/main.m -o "$APP_DIR/Contents/MacOS/2TI LMailer"

          chmod +x "$APP_DIR/Contents/MacOS/2TI LMailer"
          cp macos/icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          cp -R macos/dist/* "$APP_DIR/Contents/Resources/dist/"

          cat << 'PLIST' > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>2TI LMailer</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.tinteractive2.lmailer</string>
            <key>CFBundleName</key>
            <string>2TI LMailer</string>
            <key>CFBundleDisplayName</key>
            <string>2TI LMailer</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP_DIR"
          ln -s /Applications dmg_stage/Applications

          hdiutil create -volname "2TI LMailer" \
            -srcfolder dmg_stage \
            -ov -format UDZO \
            2ti-lmailer-latest-universal.dmg

          cp 2ti-lmailer-latest-universal.dmg 2TI-LMailer_1.0.0_universal.dmg
          ls -lh *.dmg

      - name: Upload DMG to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 2ti-lmailer-latest-universal.dmg 2TI-LMailer_1.0.0_universal.dmg --clobber
